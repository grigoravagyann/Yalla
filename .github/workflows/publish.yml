# Builds src/Yalla.Api/Dockerfile and pushes it to GitHub Container Registry, which is where
# deploy/compose.yaml pulls from.
#
# Tags: the commit SHA always (what a deployment pins), `latest` on master (what a first try
# runs), and the version tag on a v* tag. GITHUB_TOKEN with packages: write is enough to push
# to the repository's own namespace; no secret to configure. The image is built from the
# Dockerfile alone - the bundle stage inside it runs `dotnet ef migrations bundle`, so a commit
# whose model and migrations disagree still builds (backend.yml is the gate for that) but a
# commit whose migrations do not compile does not.
#
# backend.yml stays the test gate; this workflow does not wait for it. A red backend run on
# master means "do not set YALLA_VERSION to this SHA", which the deploying person can see.
name: publish

on:
  push:
    branches: [master]
    tags: ['v*']
  # Manual runs build and push a branch's image (tagged by sha only).
  workflow_dispatch:
  # A pull request that touches the image builds it and runs the bundle, but
  # pushes nothing: the proof that the Dockerfile still works, before merge.
  pull_request:
    paths:
      - src/**
      - .dockerignore
      - deploy/**
      - Directory.Build.props
      - global.json
      - .github/workflows/publish.yml

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/yalla-api

jobs:
  api-image:
    name: api-image
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # metadata-action lower-cases the image name, which GHCR requires and which is what
      # deploy/compose.yaml spells out. The sha tag is the full 40 characters, so
      # `YALLA_VERSION=$(git rev-parse HEAD)` works without abbreviation guesswork.
      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=${{ github.ref == 'refs/heads/master' }}
          tags: |
            type=sha,format=long,prefix=
            type=ref,event=tag

      # Built once and loaded into the local daemon so the migration bundle
      # inside it can be executed; pushed only afterwards, and never from a
      # pull request. The second build-push-action is a cache hit, not a rebuild.
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/Yalla.Api/Dockerfile
          load: true
          tags: ${{ env.IMAGE }}:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: The migration bundle inside the image runs
        run: docker run --rm --entrypoint /app/efbundle "${IMAGE}:smoke" --help

      - name: Push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/Yalla.Api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
